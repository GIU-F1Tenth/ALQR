# LQG Controller Configuration
# Parameters for Linear Quadratic Gaussian (LQG) controller
# Combines Extended Kalman Filter (EKF) state estimation with LQR control

lqg_controller_node:
  ros__parameters:
    # Vehicle Parameters
    wheelbase: 0.33          
    dt: 0.02                 # (50 Hz)

    # LQR Cost Matrices
    # State weights [x, y, v, theta]
    lqr_Q_diag: [10.0, 10.0, 1.0, 5.0]
    
    # Control weights [acceleration, steering]
    lqr_R_diag: [0.1, 1.0]

    # Control Limits
    max_acceleration: 5.0    
    max_steering: 0.5         

    # Extended Kalman Filter (EKF) Parameters
    # Initial state [x, y, v, theta]
    initial_state: [0.0, 0.0, 0.0, 0.0]
    
    # Initial state covariance diagonal [x, y, v, theta]
    initial_covariance_diag: [1.0, 1.0, 0.5, 0.1]
    
    # Process noise covariance diagonal [x, y, v, theta]
    process_noise_diag: [0.01, 0.01, 0.1, 0.05]
    
    # Measurement noise parameters
    measurement_noise_imu: 0.1        # IMU measurement noise
    measurement_noise_odom: 0.05      # Odometry measurement noise
    measurement_noise_position: 0.1   # Position measurement noise

    # Safety Parameters
    max_speed: 8.0                    
    min_speed: -2.0                   
    emergency_brake_deceleration: 3.0 
    obstacle_detection_enabled: true 
    min_obstacle_distance: 1.0        

    # ROS2 Topic Names
    control_topic: "/drive"                                    
    odom_topic: "/car_state/odom"                             
    imu_topic: "/imu"                                        
    trajectory_topic: "/horizon_mapper/reference_trajectory"   
    path_ready_topic: "/horizon_mapper/path_ready"            
    scan_topic: "/scan"                                       

    # QoS and Performance Settings
    qos_depth: 10                     # QoS queue depth
    enable_logging: true              # Enable performance logging
    debug_logging_enabled: false     # Enable debug logging
    use_sim_time: false              # Use simulation time
