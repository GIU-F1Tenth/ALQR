# LQR Controller Configuration
# Linear Quadratic Regulator parameters for F1TENTH trajectory tracking

# Vehicle Parameters
wheelbase: 0.33 
dt: 0.05 

# Control Limits
max_acceleration: 5.0 
max_deceleration: 9.0 
max_steering_angle: 0.9 
min_speed: 0.1 
max_speed: 15.0

# LQR Cost Function Weights
# Higher weights penalize deviations more heavily
lqr_weights:
  position_weight: 5.0 
  velocity_weight: 1.0 
  heading_weight: 6.0
  acceleration_weight: 0.3 
  steering_weight: 4.0 

# Control Parameters
control_hz: 20.0 # Control loop frequency [Hz]
lookahead_distance: 1.5 # Lookahead distance for reference point [m]
enable_feedforward: true # Enable feedforward control from reference

# Enhanced Anti-Wobble Parameters
min_lookahead_distance: 0.7
max_lookahead_distance: 2.5 
lookahead_time: 0.8 

# Curve Detection and Handling
enable_curve_detection: true
curve_lookahead_points: 5 
max_curvature_threshold: 1.0 
curve_speed_factor: 0.7 

# Steering Rate Limiting (Critical for anti-wobble)
enable_steering_rate_limit: true 
max_steering_rate: 1.5 

# Safety Parameters
enable_safety_checks: false 
safety_timeout: 1.0 # Timeout for data freshness [s]
emergency_brake_threshold: 9.0 # Emergency brake acceleration [m/s²]

# ROS2 Topics
odom_topic: "/car_state/odom"
reference_topic: "/horizon_mapper/reference_trajectory"
status_topic: "/horizon_mapper/path_ready"
control_topic: "/drive"
pose_estimate_topic: "/initialpose"

# Quality of Service
qos_depth: 10 

# Logging and Debug
enable_logging: true
debug_logging_enabled: false 
performance_logging_enabled: true 
log_frequency_divider: 10
