# LQR Controller Visualizer Configuration
# This file contains configuration options for the visualizer GUI

[display]
# GUI update frequency in Hz
update_frequency = 10

# Maximum number of data points to store in history
max_history_points = 1000

# Window size (width x height)
window_width = 1400
window_height = 900

[plotting]
# Plot line widths
trajectory_line_width = 2
vehicle_path_width = 1
control_line_width = 2

# Plot colors (matplotlib color names or hex codes)
reference_trajectory_color = blue
vehicle_path_color = red
current_position_color = red
acceleration_color = blue
steering_color = red
error_color = green
velocity_color = magenta

# Plot transparency (0.0 to 1.0)
reference_alpha = 0.7
vehicle_path_alpha = 0.8

[synthetic_data]
# Parameters for standalone mode synthetic data generation
wheelbase = 0.33
control_dt = 0.05
figure8_scale_x = 5.0
figure8_scale_y = 3.0
max_velocity = 3.0
min_velocity = 0.5
noise_scale = 0.01

[ros2]
# ROS2 topic names
odom_topic = /car_state/odom
reference_topic = /horizon_mapper/reference_trajectory
status_topic = /horizon_mapper/path_ready
control_topic = /drive
pose_estimate_topic = /initialpose
diagnostics_topic = /lqr_controller/diagnostics
state_error_topic = /lqr_controller/state_error

# QoS depth for subscriptions
qos_depth = 10

[logging]
# Enable console debug output
debug_output = false

# Log data callback information
log_callbacks = false

# Performance logging
log_performance = true
